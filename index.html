<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.S. CENTRAL | Premium Site</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #00d2ff;
            --gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --text: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--gradient);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- TELA DE LOGIN --- */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: var(--glass);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            text-align: center;
            width: 350px;
        }

        .login-box h2 { margin-bottom: 25px; font-weight: 300; letter-spacing: 2px; }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        /* --- DASHBOARD PRINCIPAL (Escondido) --- */
        #dashboard {
            display: none; /* Ativado pelo JS */
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--glass);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .time-box { text-align: right; }
        #liveClock { font-size: 2rem; font-weight: bold; color: var(--accent); }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 25px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease;
        }

        .glass-card:hover { transform: translateY(-5px); }

        .stat-number {
            font-size: 3rem;
            font-weight: 800;
            margin: 15px 0;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- BOTÕES --- */
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-entry { background: #00b09b; color: white; }
        .btn-exit { background: #ff416c; color: white; }
        .btn-add { background: var(--accent); color: #000; width: 40px; height: 40px; border-radius: 50%; }

        /* --- TABELA --- */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; opacity: 0.6; padding: 10px; font-weight: 400; }
        td { padding: 12px 10px; border-top: 1px solid var(--glass-border); }

        /* Responsividade */
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <i class="fas fa-shield-halved fa-3x" style="color: var(--accent); margin-bottom: 15px;"></i>
        <h2>CENTRAL SS.</h2>
        <input type="text" id="userInput" placeholder="Identificação do Agente">
        <button onclick="checkAccess()" class="btn btn-entry" style="width: 100%;">abrir a central</button>
        <p id="errorMsg" style="color: #ff416c; margin-top: 15px; display: none; font-size: 0.9rem;">Acesso Negado: Usuário fora da lista.</p>
    </div>
</div>

<div id="dashboard">
    <header>
        <div>
            <h1 style="margin:0; font-weight: 300;">CENTRAL <span style="font-weight: 800; color: var(--accent);">ANALISTA</span></h1>
            <p style="margin:5px 0 0; opacity: 0.7;"><i class="fas fa-user-circle"></i> Agente: <span id="agentName">---</span></p>
        </div>
        <div class="time-box">
            <div id="liveClock">00:00:00</div>
            <div id="liveDate" style="opacity: 0.8;">---</div>
        </div>
    </header>

    <div class="main-grid">
        <div class="glass-card" style="grid-row: span 2;">
            <h3><i class="fas fa-fingerprint"></i> REGISTRO DE PONTO</h3>
            <div style="display: flex; gap: 10px; margin: 20px 0;">
                <button onclick="logPoint('ENTRADA')" class="btn btn-entry"><i class="fas fa-sign-in-alt"></i> Entrada</button>
                <button onclick="logPoint('SAÍDA')" class="btn btn-exit"><i class="fas fa-sign-out-alt"></i> Saída</button>
            </div>
            <table id="pointTable">
                <thead><tr><th>TIPO</th><th>DATA</th><th>HORA</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="glass-card">
            <h3>ANÁLISES</h3>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div class="stat-number" id="v1">0</div>
                <button onclick="inc('v1')" class="btn-add"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <div class="glass-card" style="border-left: 4px solid #e67e22;">
            <h3>WO's REGISTRADOS</h3>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div class="stat-number" id="v2" style="background: linear-gradient(to right, #fff, #e67e22); -webkit-background-clip: text;">0</div>
                <button onclick="inc('v2')" class="btn-add" style="background: #e67e22;"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <div class="glass-card" style="border-left: 4px solid #ff416c;">
            <h3>EXPOSEDS</h3>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div class="stat-number" id="v3" style="background: linear-gradient(to right, #fff, #ff416c); -webkit-background-clip: text;">0</div>
                <button onclick="inc('v3')" class="btn-add" style="background: #ff416c;"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <div class="glass-card">
            <h3><i class="fas fa-poll-h"></i> ENQUETE DO DIA</h3>
            <p>Meta batida com sucesso?</p>
            <button class="btn" style="background: var(--glass); color: white; width: 100%; margin-bottom: 10px;">Sim, 100%</button>
            <button class="btn" style="background: var(--glass); color: white; width: 100%;">Em andamento</button>
        </div>
    </div>
</div>

<script>
    // --- LISTA DE ACESSO ---
    const whitelist = [
    "ADMIN",
    "SS_OPERADOR",
    "GESTOR",
    "MATHEUS",
    "GOMES",
    "ICE" ];
    function checkAccess() {
        const val = document.getElementById('userInput').value.toUpperCase();
        if(whitelist.includes(val)) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('agentName').innerText = val;
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    // Relógio
    setInterval(() => {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('pt-BR');
        document.getElementById('liveDate').innerText = now.toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'short'});
    }, 1000);

    // Funções
    function logPoint(type) {
        const now = new Date();
        const row = document.getElementById('pointTable').getElementsByTagName('tbody')[0].insertRow(0);
        row.style.animation = "fadeIn 0.5s ease";
        row.innerHTML = `<td style="color:${type==='ENTRADA'?'#00b09b':'#ff416c'}">${type}</td><td>${now.toLocaleDateString()}</td><td>${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}</td>`;
    }

    function inc(id) {
        const el = document.getElementById(id);
        el.innerText = parseInt(el.innerText) + 1;
    }
</script>

</body>
</html>
