<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.S. CENTRAL | Gestão por Níveis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #00d2ff;
            --gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --text: #ffffff;
            --success: #00b09b;
            --danger: #ff416c;
            --admin: #f1c40f;
            --mediador: #a29bfe;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--gradient); background-attachment: fixed;
            color: var(--text); min-height: 100vh; overflow-x: hidden;
        }

        /* Login */
        #loginOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px); display: flex;
            justify-content: center; align-items: center; z-index: 9999;
        }

        .login-box {
            background: var(--glass); padding: 40px; border-radius: 20px;
            border: 1px solid var(--glass-border); text-align: center; width: 350px;
        }

        .login-box input {
            width: 100%; padding: 12px; margin: 20px 0;
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 8px; color: white; text-align: center; font-size: 1rem;
        }

        /* Dashboards */
        #dashboard, #mediadorPanel { display: none; padding: 30px; max-width: 1400px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding: 20px; background: var(--glass);
            border-radius: 15px; border: 1px solid var(--glass-border);
        }

        .main-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; border: 1px solid var(--glass-border);
        }

        .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--accent); }

        .btn {
            padding: 10px 20px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }

        .btn-entry { background: var(--success); color: white; }
        .btn-exit { background: var(--danger); color: white; }
        .btn-call { background: var(--accent); color: #000; width: 100%; padding: 20px; font-size: 1.2rem; }
        
        #adminPanel { display: none; border: 2px solid var(--admin); grid-column: span 3; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { padding: 12px; border-bottom: 1px solid var(--glass-border); text-align: left; }

        #callAlert {
            display: none; position: fixed; top: 20px; right: 20px; 
            background: var(--admin); color: #000; padding: 20px; 
            border-radius: 10px; z-index: 10000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="callAlert">
    <strong id="callText">ALERTA DE CHAMADO!</strong><br>
    <span id="whoCalled" style="font-size: 0.8rem;"></span><br>
    <button onclick="aceitarChamado()" class="btn" style="background:#000; color:#fff; margin-top:10px;">ACEITAR AGORA</button>
</div>

<div id="loginOverlay">
    <div class="login-box">
        <i class="fas fa-fingerprint fa-4x" style="color: var(--accent); margin-bottom: 15px;"></i>
        <h2>SISTEMA CENTRAL</h2>
        <input type="password" id="userInput" placeholder="Seu ID de Agente">
        <button onclick="checkAccess()" class="btn btn-entry" style="width: 100%;">AUTENTICAR</button>
    </div>
</div>

<div id="mediadorPanel">
    <header>
        <h1>MEDIADOR <span id="medDisplayName" style="color: var(--mediador);"></span></h1>
        <button onclick="location.reload()" class="btn btn-exit">SAIR</button>
    </header>
    <div class="glass-card" style="max-width: 500px; margin: 0 auto; text-align: center;">
        <i class="fas fa-headset fa-4x" style="color: var(--mediador); margin-bottom: 20px;"></i>
        <h2>SOLICITAR ANÁLISE SS</h2>
        <button onclick="criarChamado()" class="btn btn-call" style="background: var(--mediador);">SOLICITAR AGORA</button>
        <div id="medStatus" style="margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 10px;"></div>
    </div>
</div>

<div id="dashboard">
    <header>
        <div>
            <h1 style="margin:0; letter-spacing: 2px;">CENTRAL <span style="color: var(--accent);">SS.</span></h1>
            <p><i class="fas fa-user-shield"></i> <span id="roleLabel"></span>: <span id="agentName">---</span></p>
        </div>
        <div style="text-align: right;">
            <div id="liveClock" style="font-size: 1.8rem; font-weight: bold; color: var(--accent);">00:00:00</div>
        </div>
    </header>

    <div class="main-grid">
        <div id="adminPanel" class="glass-card">
            <h3 style="color: var(--admin);"><i class="fas fa-crown"></i> COMANDO CENTRAL (MONITORAMENTO)</h3>
            <div id="adminContent"></div>
            <button onclick="resetAllData()" class="btn" style="background:#ff416c; width:100%; margin-top:10px;">REINICIAR TUDO (NOVO DIA)</button>
        </div>

        <div class="glass-card">
            <h3><i class="fas fa-history"></i> REGISTRO DE PONTO</h3>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <button onclick="logAction('ENTRADA')" class="btn btn-entry" style="flex:1">ENTRADA</button>
                <button onclick="logAction('SAÍDA')" class="btn btn-exit" style="flex:1">SAÍDA</button>
            </div>
            <div style="max-height: 200px; overflow-y: auto;">
                <table id="pointTable"><tbody id="pointBody"></tbody></table>
            </div>
        </div>

        <div class="glass-card">
            <h3><i class="fas fa-search"></i> MINHAS ANÁLISES</h3>
            <div class="stat-number" id="v1">0</div>
            <button onclick="updateStat('v1', 1)" class="btn btn-entry" style="width:100%">+1 ANÁLISE MANUAL</button>
        </div>

        <div class="glass-card">
            <h3><i class="fas fa-exclamation-triangle"></i> WO / EXPOSED</h3>
            <div style="display: flex; gap: 10px;">
                <div style="text-align:center; flex:1">
                    <div class="stat-number" id="v2" style="color: #e67e22;">0</div>
                    <button onclick="updateStat('v2', 1)" class="btn" style="background:#e67e22; width:100%">WO</button>
                </div>
                <div style="text-align:center; flex:1">
                    <div class="stat-number" id="v3" style="color: #ff416c;">0</div>
                    <button onclick="updateStat('v3', 1)" class="btn" style="background:#ff416c; width:100%">EXP</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURAÇÃO DE SLOTS (EDITE AQUI)
    // ==========================================
    const whitelistADMs = ["DIR SS", "AKQG", "ADM_SLOT_1"];
    const whitelistAnalistas = ["BIEL", "GOMES", "ABERTO", "AN_SLOT_1"];
    const whitelistMediadores = ["teste", "MED_FELIPE", "MED_SLOT_1"];
    // ==========================================

    let currentUser = "";
    let currentCallId = null;

    function checkAccess() {
        const val = document.getElementById('userInput').value.toUpperCase().trim();
        
        if(whitelistMediadores.includes(val)) {
            currentUser = val;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mediadorPanel').style.display = 'block';
            document.getElementById('medDisplayName').innerText = currentUser;
            setInterval(renderMedStatus, 2000);
        } 
        else if(whitelistADMs.includes(val) || whitelistAnalistas.includes(val)) {
            currentUser = val;
            const isAdmin = whitelistADMs.includes(val);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('agentName').innerText = currentUser;
            document.getElementById('roleLabel').innerText = isAdmin ? "ADM" : "Analista";
            
            if(isAdmin) document.getElementById('adminPanel').style.display = 'block';
            
            loadUserData();
            updateAdminView();
            setInterval(listenForCalls, 3000);
        } else {
            alert("ID Não Reconhecido!");
        }
    }

    // --- LÓGICA DO MEDIADOR ---
    function criarChamado() {
        let chamados = JSON.parse(localStorage.getItem('fila_chamados')) || [];
        const novo = { 
            id: Date.now(), 
            status: 'ABERTO', 
            mediador: currentUser, 
            analista: null, 
            hora: new Date().toLocaleTimeString() 
        };
        chamados.push(novo);
        localStorage.setItem('fila_chamados', JSON.stringify(chamados));
        alert("Chamado enviado!");
    }

    function renderMedStatus() {
        let chamados = JSON.parse(localStorage.getItem('fila_chamados')) || [];
        const container = document.getElementById('medStatus');
        const meusChamados = chamados.filter(c => c.mediador === currentUser);
        if(meusChamados.length === 0) {
            container.innerHTML = "Nenhum chamado pendente.";
            return;
        }
        const ultimo = meusChamados[meusChamados.length - 1];
        container.innerHTML = `
            <p style="font-size: 0.8rem; margin:0;">Pedido às ${ultimo.hora}</p>
            <b style="color:${ultimo.status==='ABERTO'?'#f1c40f':'#2ecc71'}">
            ${ultimo.status === 'ABERTO' ? 'AGUARDANDO ANALISTA...' : 'ACEITO POR: ' + ultimo.analista}
            </b>`;
    }

    // --- LÓGICA DO ANALISTA ---
    function listenForCalls() {
        let chamados = JSON.parse(localStorage.getItem('fila_chamados')) || [];
        const aberto = chamados.find(c => c.status === 'ABERTO');
        if(aberto) {
            currentCallId = aberto.id;
            document.getElementById('whoCalled').innerText = "Solicitado por: " + aberto.mediador;
            document.getElementById('callAlert').style.display = 'block';
        } else {
            document.getElementById('callAlert').style.display = 'none';
        }
    }

    function aceitarChamado() {
        let chamados = JSON.parse(localStorage.getItem('fila_chamados')) || [];
        let idx = chamados.findIndex(c => c.id === currentCallId);
        if(idx !== -1 && chamados[idx].status === 'ABERTO') {
            chamados[idx].status = 'ACEITO';
            chamados[idx].analista = currentUser;
            localStorage.setItem('fila_chamados', JSON.stringify(chamados));
            updateStat('v1', 1);
            alert("Chamado aceito!");
        }
        document.getElementById('callAlert').style.display = 'none';
    }

    // --- FUNÇÕES DE DADOS ---
    function updateStat(key, value) {
        let data = JSON.parse(localStorage.getItem(currentUser)) || {v1:0, v2:0, v3:0, pontos:[]};
        data[key] += value;
        localStorage.setItem(currentUser, JSON.stringify(data));
        loadUserData();
        updateAdminView();
    }

    function logAction(type) {
        let data = JSON.parse(localStorage.getItem(currentUser)) || {v1:0, v2:0, v3:0, pontos:[]};
        data.pontos.unshift({ type: type, time: new Date().toLocaleTimeString() });
        localStorage.setItem(currentUser, JSON.stringify(data));
        loadUserData();
    }

    function loadUserData() {
        let data = JSON.parse(localStorage.getItem(currentUser)) || {v1:0, v2:0, v3:0, pontos:[]};
        document.getElementById('v1').innerText = data.v1;
        document.getElementById('v2').innerText = data.v2;
        document.getElementById('v3').innerText = data.v3;
        document.getElementById('pointBody').innerHTML = data.pontos.map(p => `<tr><td>${p.type}</td><td>${p.time}</td></tr>`).join('');
    }

    function updateAdminView() {
        if(!whitelistADMs.includes(currentUser)) return;
        let html = "<table><tr><th>Agente</th><th>Tipo</th><th>Análises</th><th>WO/EXP</th></tr>";
        [...whitelistADMs, ...whitelistAnalistas].forEach(user => {
            let type = whitelistADMs.includes(user) ? "ADM" : "Analista";
            let d = JSON.parse(localStorage.getItem(user)) || {v1:0, v2:0, v3:0};
            html += `<tr><td>${user}</td><td><small>${type}</small></td><td>${d.v1}</td><td>${d.v2}/${d.v3}</td></tr>`;
        });
        document.getElementById('adminContent').innerHTML = html + "</table>";
    }

    function resetAllData() {
        if(confirm("Deseja zerar os dados de todos para o novo dia?")) {
            localStorage.clear();
            location.reload();
        }
    }

    setInterval(() => {
        document.getElementById('liveClock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
