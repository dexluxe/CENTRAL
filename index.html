<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.S. CENTRAL | Gestão Total</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #00d2ff;
            --gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --text: #ffffff;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--gradient); background-attachment: fixed;
            color: var(--text); min-height: 100vh; overflow-x: hidden;
        }

        #loginOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px); display: flex;
            justify-content: center; align-items: center; z-index: 9999;
        }

        .login-box {
            background: var(--glass); padding: 40px; border-radius: 20px;
            border: 1px solid var(--glass-border); text-align: center; width: 350px;
        }

        .login-box input {
            width: 100%; padding: 12px; margin: 20px 0;
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 8px; color: white; text-align: center; font-size: 1rem;
        }

        #dashboard { display: none; padding: 30px; max-width: 1400px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding: 20px; background: var(--glass);
            border-radius: 15px; border: 1px solid var(--glass-border);
        }

        .main-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; border: 1px solid var(--glass-border);
        }

        .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--accent); }

        .btn {
            padding: 10px 20px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }

        .btn-entry { background: #00b09b; color: white; }
        .btn-exit { background: #ff416c; color: white; }
        .btn-reset { background: #f1c40f; color: #000; margin-top: 15px; width: 100%; }
        .btn-add { background: var(--accent); color: #000; border-radius: 50%; width: 35px; height: 35px; }

        #adminPanel {
            display: none; border: 2px solid #f1c40f; background: rgba(241, 196, 15, 0.05);
            margin-bottom: 25px; grid-column: span 3;
        }

        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 12px; border-bottom: 1px solid var(--glass-border); text-align: left; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <i class="fas fa-fingerprint fa-4x" style="color: var(--accent); margin-bottom: 15px;"></i>
        <h2>SISTEMA CENTRAL</h2>
        <input type="password" id="userInput" placeholder="Identificação do Agente">
        <button onclick="checkAccess()" class="btn btn-entry" style="width: 100%;">AUTENTICAR</button>
        <p id="errorMsg" style="color: #ff416c; display: none; margin-top: 15px;">Acesso Negado: Credencial inválida.</p>
    </div>
</div>

<div id="dashboard">
    <header>
        <div>
            <h1 style="margin:0; letter-spacing: 2px;">CENTRAL <span style="color: var(--accent);">SS.</span></h1>
            <p><i class="fas fa-user-shield"></i> Operador: <span id="agentName">---</span></p>
        </div>
        <div style="text-align: right;">
            <div id="liveClock" style="font-size: 1.8rem; font-weight: bold; color: var(--accent);">00:00:00</div>
            <div id="liveDate" style="opacity: 0.7; text-transform: capitalize;">---</div>
        </div>
    </header>

    <div class="main-grid">
        <div id="adminPanel" class="glass-card">
            <h3 style="color: #f1c40f;"><i class="fas fa-crown"></i> COMANDO CENTRAL (DIR SS)</h3>
            <div id="adminContent">Sincronizando dados...</div>
            <button onclick="resetAllData()" class="btn btn-reset">
                <i class="fas fa-trash-alt"></i> ZERAR SISTEMA (NOVO DIA)
            </button>
        </div>

        <div class="glass-card" style="grid-row: span 2;">
            <h3><i class="fas fa-history"></i> REGISTRO DE PONTO</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button onclick="logAction('ENTRADA')" class="btn btn-entry">ENTRADA</button>
                <button onclick="logAction('SAÍDA')" class="btn btn-exit">SAÍDA</button>
            </div>
            <div style="max-height: 350px; overflow-y: auto; border-radius: 10px; background: rgba(0,0,0,0.2);">
                <table id="pointTable">
                    <thead><tr><th style="font-size:0.7rem">TIPO</th><th style="font-size:0.7rem">DATA/HORA</th></tr></thead>
                    <tbody id="pointBody"></tbody>
                </table>
            </div>
        </div>

        <div class="glass-card">
            <h3><i class="fas fa-search"></i> ANÁLISES</h3>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div class="stat-number" id="v1">0</div>
                <button onclick="updateStat('v1', 1)" class="btn-add"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <div class="glass-card">
            <h3><i class="fas fa-exclamation-triangle"></i> WO's</h3>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div class="stat-number" id="v2" style="color: #e67e22;">0</div>
                <button onclick="updateStat('v2', 1)" class="btn-add" style="background:#e67e22;"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <div class="glass-card">
            <h3><i class="fas fa-skull-crossbones"></i> EXPOSEDS</h3>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div class="stat-number" id="v3" style="color: #ff416c;">0</div>
                <button onclick="updateStat('v3', 1)" class="btn-add" style="background:#ff416c;"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <div class="glass-card">
            <h3><i class="fas fa-poll-h"></i> STATUS DA META</h3>
            <p style="opacity:0.7; font-size:0.9rem">A meta foi atingida?</p>
            <div style="display: flex; gap: 5px;">
                <button onclick="updateStat('enquete', 'SIM')" class="btn" style="flex:1; background:var(--glass); color:#2ecc71;">SIM</button>
                <button onclick="updateStat('enquete', 'NÃO')" class="btn" style="flex:1; background:var(--glass); color:#e74c3c;">NÃO</button>
            </div>
        </div>
    </div>
</div>

<script>
    const whitelist = ["DIR SS", "ABERTO", "BIEL", "GOMES", "AKQG"];
    let currentUser = "";

    function checkAccess() {
        const val = document.getElementById('userInput').value.toUpperCase().trim();
        if(whitelist.includes(val)) {
            currentUser = val;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('agentName').innerText = currentUser;
            
            if(currentUser === "DIR SS") {
                document.getElementById('adminPanel').style.display = 'block';
            }
            
            loadUserData();
            updateAdminView();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('userInput').value = "";
        }
    }

    function updateStat(key, value) {
        let data = getLocalData(currentUser);
        if(key === 'enquete') {
            data.enquete = value;
            alert("Status atualizado!");
        } else {
            data[key] += value;
            document.getElementById(key).innerText = data[key];
        }
        saveLocalData(currentUser, data);
        updateAdminView();
    }

    function logAction(type) {
        let data = getLocalData(currentUser);
        const now = new Date();
        data.pontos.unshift({ type: type, time: now.toLocaleString('pt-BR') });
        saveLocalData(currentUser, data);
        renderPoints(data.pontos);
        updateAdminView();
    }

    function resetAllData() {
        if(confirm("ATENÇÃO: Isso apagará os dados de TODOS os analistas para um novo dia. Confirmar?")) {
            whitelist.forEach(user => localStorage.removeItem(user));
            alert("Sistema Resetado!");
            location.reload(); // Recarrega para limpar a tela
        }
    }

    // Auxiliares de Dados
    function getLocalData(user) {
        return JSON.parse(localStorage.getItem(user)) || {v1:0, v2:0, v3:0, pontos:[], enquete: "-"};
    }
    function saveLocalData(user, data) {
        localStorage.setItem(user, JSON.stringify(data));
    }

    function loadUserData() {
        let data = getLocalData(currentUser);
        document.getElementById('v1').innerText = data.v1;
        document.getElementById('v2').innerText = data.v2;
        document.getElementById('v3').innerText = data.v3;
        renderPoints(data.pontos);
    }

    function renderPoints(pontos) {
        const body = document.getElementById('pointBody');
        body.innerHTML = pontos.map(p => `
            <tr>
                <td style="color:${p.type==='ENTRADA'?'#00b09b':'#ff416c'}; font-weight:bold">${p.type}</td>
                <td style="font-size:0.8rem">${p.time}</td>
            </tr>
        `).join('');
    }

    function updateAdminView() {
        if(currentUser !== "DIR SS") return;
        let html = "<table><tr><th>Analista</th><th>Análises</th><th>WOs</th><th>Exposeds</th><th>Meta</th></tr>";
        whitelist.forEach(user => {
            if(user === "DIR SS") return;
            let d = getLocalData(user);
            html += `<tr>
                <td><strong>${user}</strong></td>
                <td>${d.v1}</td>
                <td>${d.v2}</td>
                <td>${d.v3}</td>
                <td style="color:${d.enquete==='SIM'?'#2ecc71':'#e74c3c'}">${d.enquete}</td>
            </tr>`;
        });
        document.getElementById('adminContent').innerHTML = html + "</table>";
    }

    setInterval(() => {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('pt-BR');
        document.getElementById('liveDate').innerText = now.toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'});
    }, 1000);
</script>

</body>
</html>
